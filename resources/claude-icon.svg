<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
    <title>Usage Monitor</title>
    <g>
        <!-- Monitor frame -->
        <rect x="20" y="30" width="216" height="150" rx="8" fill="none" stroke="#569CD6" stroke-width="8"/>

        <!-- Screen background -->
        <rect x="32" y="42" width="192" height="126" fill="#1E1E1E"/>

        <!-- Dashboard bars -->
        <rect x="50" y="120" width="30" height="35" fill="#4EC9B0" rx="2"/>
        <rect x="95" y="95" width="30" height="60" fill="#4EC9B0" rx="2"/>
        <rect x="140" y="75" width="30" height="80" fill="#CE9178" rx="2"/>
        <rect x="185" y="60" width="30" height="95" fill="#F48771" rx="2"/>

        <!-- Monitor stand -->
        <rect x="108" y="180" width="40" height="30" fill="#569CD6" rx="4"/>
        <rect x="80" y="210" width="96" height="8" fill="#569CD6" rx="4"/>

        <!-- Small indicator dots -->
        <circle cx="128" cy="60" r="4" fill="#4EC9B0"/>
        <circle cx="145" cy="60" r="4" fill="#CE9178"/>
        <circle cx="162" cy="60" r="4" fill="#F48771"/>
    </g>
</svg>
